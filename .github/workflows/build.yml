# Checks every push and pull request: builds NeoTS2 with two compilers, treats warnings as errors,
# runs the tests normally, with AddressSanitizer and in a debug build that fails any test leaking
# memory, measures test coverage, fuzzes every file reader briefly, and builds and tests on Linux and macOS. The app itself (which needs SDL 3 and FreeType) is skipped here; the libraries,
# tools and tests build without them. The game's own files are never available here.
name: build

on:
  push:
  pull_request:

# A repository can set the variable RUNNER to run these jobs on its own machine instead of GitHub's.
# SDL3_DIR is cleared so a machine's own SDL install can never be picked up.
env:
  SDL3_DIR: ""

jobs:
  test:
    runs-on: ${{ vars.RUNNER || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC, warnings as errors
            config: Release
            flags: "-DNEOTS2_STRICT=ON"
          - name: MSVC with AddressSanitizer
            config: RelWithDebInfo
            flags: "-DNEOTS2_STRICT=ON -DNEOTS2_ASAN=ON"
          - name: MSVC debug, leak check
            config: Debug
            flags: "-DNEOTS2_STRICT=ON"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        shell: pwsh
        run: |
          # AddressSanitizer's runtime lives beside the compiler.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name | Select-Object -Last 1
          $env:PATH = "$($msvc.FullName)\bin\Hostx64\x64;$env:PATH"
          # The tests come in groups (see CMakeLists.txt), run side by side.
          ctest --test-dir build -C ${{ matrix.config }} --output-on-failure -j 4

  # Linux and macOS: the libraries, tools and tests built and run as on a contributor's machine. They
  # run on GitHub's machines, only in this repository.
  other-systems:
    if: github.repository == 'Asli-s/NeoTS2'
    strategy:
      fail-fast: false
      matrix:
        include:
          # jobs: one compile per core. With no number make starts every file at once, which can be more
          # than the macOS machine's memory holds.
          - name: Linux, GCC
            os: ubuntu-latest
            jobs: 4
          - name: macOS, Apple Silicon
            os: macos-15
            jobs: 3
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel ${{ matrix.jobs }}
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

  coverage:
    name: Clang, coverage
    runs-on: ${{ vars.RUNNER || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build with Clang, run the tests and measure coverage
        shell: pwsh
        run: ./tools/coverage.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-coverage/report

  fuzz:
    name: Fuzz every file reader
    runs-on: ${{ vars.RUNNER || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the fuzz targets
        run: |
          cmake -S . -B build-fuzz -A x64 -DNEOTS2_FUZZ=ON
          cmake --build build-fuzz --config RelWithDebInfo --parallel
      - name: Fuzz each reader for 15 seconds
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name | Select-Object -Last 1
          $env:PATH = "$($msvc.FullName)\bin\Hostx64\x64;$env:PATH"
          # Four readers at a time, each for the same 15 seconds as on its own.
          $root = $PWD.Path
          $results = Get-ChildItem build-fuzz\RelWithDebInfo\*_fuzz.exe | ForEach-Object -ThrottleLimit 4 -Parallel {
              $corpus = Join-Path $using:root "corpus\$($_.BaseName)"
              New-Item -ItemType Directory -Force $corpus | Out-Null
              $last = & $_.FullName $corpus -max_total_time=15 -rss_limit_mb=2048 2>&1 | Select-Object -Last 1
              [pscustomobject]@{ Name = $_.BaseName; Last = "$last"; Failed = $LASTEXITCODE -ne 0 }
          }
          $results | Sort-Object Name | ForEach-Object { "$($_.Name): $($_.Last)" }
          $failed = @($results | Where-Object Failed | ForEach-Object Name)
          if ($failed) { throw "fuzzing found problems in: $($failed -join ', ')" }
