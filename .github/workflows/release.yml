# Builds the Windows, Linux and macOS release downloads. It runs only by hand, from the Actions page
# (Run workflow), on the branch or tag chosen there.
# Each job tests its build and keeps its download as the run's artifact, to attach to the release.
name: release

on:
  workflow_dispatch:

jobs:
  windows:
    if: github.repository == 'Asli-s/NeoTS2'
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # A release build names its commit and checks it against the release tags.
          fetch-depth: 0
      # SDL 3.4.16 with our Direct3D 12 fix (see third_party/sdl/README.md), and FreeType for the UI
      # fonts. Each source download is checked against the hash of the one our releases were built from.
      - name: Build SDL 3 and FreeType
        timeout-minutes: 30
        run: |
          # Both are built with Ninja from Visual Studio's developer shell, which runs the compiler
          # directly. Through MSBuild, a test compile in SDL's setup hung on GitHub's machines.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          $deps = Join-Path $env:RUNNER_TEMP "deps"
          New-Item -ItemType Directory -Force $deps | Out-Null
          # Each place is tried in turn, as a mirror can stall. Any copy with the right hash will do.
          function Get-Source([string[]]$urls, [string]$sha256) {
              $file = Join-Path $deps (Split-Path $urls[0] -Leaf)
              foreach ($url in $urls) {
                  Write-Host "Downloading $url"
                  # curl gives up on a download that stalls (under 1 KB/s for 30 seconds) or takes over
                  # two minutes, where Invoke-WebRequest's timeout only covers connecting.
                  & "$env:SystemRoot\System32\curl.exe" -fsSL --retry 1 --connect-timeout 30 --max-time 120 `
                      --speed-limit 1024 --speed-time 30 -o $file $url
                  if ($LASTEXITCODE -eq 0) {
                      $hash = (Get-FileHash $file -Algorithm SHA256).Hash
                      if ($hash -eq $sha256) { break }
                      Write-Warning "$url gave SHA-256 $hash, not $sha256."
                  } else {
                      Write-Warning "$url failed (curl exit code $LASTEXITCODE)."
                  }
                  Remove-Item -Force $file -ErrorAction SilentlyContinue
              }
              if (-not (Test-Path $file)) { throw "Couldn't download $(Split-Path $file -Leaf) with SHA-256 $sha256." }
              # CMake unpacks .tar.xz itself, without the system's tar.
              Write-Host "Unpacking $file"
              Push-Location $deps
              cmake -E tar xf $file
              $unpacked = $LASTEXITCODE
              Pop-Location
              if ($unpacked -ne 0) { throw "Couldn't unpack $file." }
          }
          function Invoke-Native([string]$exe, [string[]]$arguments) {
              & $exe @arguments
              if ($LASTEXITCODE -ne 0) { throw "$exe $($arguments -join ' ') failed ($LASTEXITCODE)" }
          }

          Get-Source "https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz" `
              "7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68"
          $sdl = Join-Path $deps "SDL3-3.4.16"
          Invoke-Native git @("-C", $sdl, "apply", "$env:GITHUB_WORKSPACE\third_party\sdl\d3d12-descriptor-heap.patch")
          Invoke-Native cmake @("-S", $sdl, "-B", "$sdl\build", "-G", "Ninja", "-DCMAKE_BUILD_TYPE=Release",
              "-DSDL_SHARED=ON", "-DSDL_STATIC=OFF", "-DSDL_TESTS=OFF", "-DSDL_TEST_LIBRARY=OFF", "-DSDL_EXAMPLES=OFF",
              "-DCMAKE_INSTALL_PREFIX=$deps\sdl3")
          Invoke-Native cmake @("--build", "$sdl\build")
          Invoke-Native cmake @("--install", "$sdl\build")

          Get-Source @("https://downloads.sourceforge.net/project/freetype/freetype2/2.13.3/freetype-2.13.3.tar.xz",
                       "https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz") `
              "0550350666d427c74daeb85d5ac7bb353acba5f76956395995311a9c6f063289"
          $freetype = Join-Path $deps "freetype-2.13.3"
          Invoke-Native cmake @("-S", $freetype, "-B", "$freetype\build", "-G", "Ninja", "-DCMAKE_BUILD_TYPE=Release",
              "-DFT_DISABLE_ZLIB=TRUE", "-DFT_DISABLE_BZIP2=TRUE", "-DFT_DISABLE_PNG=TRUE", "-DFT_DISABLE_HARFBUZZ=TRUE",
              "-DFT_DISABLE_BROTLI=TRUE", "-DCMAKE_INSTALL_PREFIX=$deps\freetype")
          Invoke-Native cmake @("--build", "$freetype\build")
          Invoke-Native cmake @("--install", "$freetype\build")
      - name: Build
        run: |
          $deps = Join-Path $env:RUNNER_TEMP "deps"
          cmake -S . -B build -A x64 -DNEOTS2_RELEASE=ON -DNEOTS2_STRICT=ON "-DSDL3_DIR=$deps\sdl3\cmake" `
              "-Dfreetype_DIR=$deps\freetype\lib\cmake\freetype"
          if ($LASTEXITCODE -ne 0) { throw "Configure failed." }
          cmake --build build --config Release --target neots2 neots2-launcher vm_tests --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }
      - name: Test
        run: |
          build\Release\vm_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "Tests failed." }
      - name: Package
        run: ./tools/package.ps1 -Build build\Release -Out build\download
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/download/NeoTS2-*
          if-no-files-found: error
      # Crash reports need the symbols of the very programs players run. Upload these with
      # tools/upload_symbols.ps1 -Build <unpacked folder>\Release before the release goes out.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-symbols
          path: |
            build/Release/neots2.exe
            build/Release/neots2-launcher.exe
            build/Release/*.pdb
            build/generated/neots2_version.hpp
          if-no-files-found: error

  linux:
    if: github.repository == 'Asli-s/NeoTS2'
    name: Linux x86_64
    # The oldest Ubuntu GitHub offers with a new enough compiler, so the download runs on as many
    # systems as possible (glibc 2.39 or newer).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # A release build names its commit and checks it against the release tags.
          fetch-depth: 0
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc patchelf libfreetype-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libdecor-0-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libcurl4-openssl-dev
      # Ubuntu 24.04 has no SDL 3 package, so it is built here, the same version the Windows download ships.
      - name: Build SDL 3
        run: |
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl"
          cmake -S "$RUNNER_TEMP/sdl" -B "$RUNNER_TEMP/sdl/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
          cmake --build "$RUNNER_TEMP/sdl/build"
          cmake --install "$RUNNER_TEMP/sdl/build"
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEOTS2_RELEASE=ON \
            -DSDL3_DIR="$RUNNER_TEMP/sdl3/lib/cmake/SDL3"
          cmake --build build --target neots2 neots2-launcher vm_tests --parallel 4
      - name: Test
        run: build/vm_tests
      - name: Package
        run: sh tools/package_linux.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build/NeoTS2-*-linux-x86_64.tar.gz
          if-no-files-found: error
      # The programs with their debug info, for crash reports. Upload these with BugSplat's
      # symbol-upload before the release goes out.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-symbols
          path: build/package/symbols
          if-no-files-found: error

  macos:
    if: github.repository == 'Asli-s/NeoTS2'
    name: macOS, Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the build tools
        run: brew install cmake sdl3 shaderc spirv-cross freetype
      - name: Build
        run: |
          cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release -DNEOTS2_RELEASE=ON
          cmake --build build-macos --target neots2 neots2-launcher vm_tests --parallel 3
      - name: Test
        run: build-macos/vm_tests
      - name: Package
        run: sh tools/package_macos.sh build-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build-macos/NeoTS2-*-macos-arm64.zip
          if-no-files-found: error
      # The programs' .dSYM symbols, for crash reports. Upload these with BugSplat's symbol-upload
      # before the release goes out.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-symbols
          path: build-macos/symbols
          if-no-files-found: error
